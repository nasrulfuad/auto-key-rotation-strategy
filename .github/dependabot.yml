version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/my_app", "/partner_app"]
    schedule:
      interval: weekly
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: ["/my_app", "/partner_app"]
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
