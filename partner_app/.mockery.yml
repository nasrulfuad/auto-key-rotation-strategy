template: testify
dir: '{{.InterfaceDir}}/{{.SrcPackageName}}mocks'
pkgname: '{{.SrcPackageName}}mocks'
structname: 'Mock{{.InterfaceName}}'
filename: '{{.InterfaceName | snakecase}}.go'
force-file-write: true
formatter: goimports
log-level: warn
packages:
  github.com/nasrulfuad/jwks_key_rotation/partner_app/internal/adapter/repository:
    interfaces:
      SigningKeyReader: {}
      SigningKeyWriter: {}
      ActivationNotificationReader: {}
      ActivationNotificationWriter: {}
      EntitlementReader: {}
      EntitlementWriter: {}
      JobLock: {}
      DatabaseProbe: {}
  github.com/nasrulfuad/jwks_key_rotation/partner_app/internal/adapter/gateway:
    interfaces:
      ActivationNotificationSender: {}
  github.com/nasrulfuad/jwks_key_rotation/partner_app/internal/infra/rsakey:
    interfaces:
      KeyPairGenerator: {}
  github.com/nasrulfuad/jwks_key_rotation/partner_app/internal/infra/sealer:
    interfaces:
      PrivateKeySealer: {}
  github.com/nasrulfuad/jwks_key_rotation/partner_app/internal/infra/systemclock:
    interfaces:
      Clock: {}
      UUIDGenerator: {}
  github.com/nasrulfuad/jwks_key_rotation/partner_app/internal/infra/logging:
    interfaces:
      Logger: {}
  github.com/nasrulfuad/jwks_key_rotation/partner_app/internal/infra/jwt:
    interfaces:
      TokenIssuer: {}
      TokenVerifier: {}
  github.com/nasrulfuad/jwks_key_rotation/partner_app/internal/infra/jwks:
    interfaces:
      PeerKeySet: {}
