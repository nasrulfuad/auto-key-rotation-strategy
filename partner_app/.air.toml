root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/server ./cmd/server"
bin = "./tmp/server"
include_ext = ["go", "sql", "json"]
exclude_dir = ["tmp", "internal/usecase/port/mocks"]
exclude_regex = ["_test\\.go$"]
delay = 500
send_interrupt = true
kill_delay = "3s"
stop_on_error = true
poll = true
poll_interval = 500

[log]
time = true

[misc]
clean_on_exit = true
