version: "2"
rules:
  - name: no-select-star
    message: "name every column explicitly; SELECT * breaks silently the moment a migration adds a column"
    rule: |
      query.sql.contains("SELECT *") || query.sql.contains("select *")
sql:
  - engine: postgresql
    schema: "migrations"
    queries: "query"
    rules:
      - no-select-star
    gen:
      go:
        package: "store"
        out: "internal/store"
        sql_package: "database/sql"
        emit_prepared_queries: false
        emit_interface: true
        emit_json_tags: false
        emit_pointers_for_null_types: true
        initialisms: ["id"]
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
