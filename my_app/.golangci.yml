version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - bodyclose
    - nolintlint
    - depguard
    # gosec is the static security analysis gate. Findings are fixed, or excluded below with the reason they
    # cannot apply.
    - gosec

  settings:
    errcheck:
      check-type-assertions: true
    nolintlint:
      require-explanation: true
      require-specific: true

    depguard:
      rules:
        domain:
          list-mode: strict
          files:
            - "**/internal/domain/*.go"
          allow:
            - $gostd
            - github.com/google/uuid
            - github.com/nasrulfuad/auto-key-rotation-strategy/my_app/internal/domain
            - github.com/stretchr/testify
          deny:
            - pkg: net/http
              desc: transport is the adapter ring's concern
            - pkg: database/sql
              desc: persistence is the adapter ring's concern
            - pkg: crypto/rsa
              desc: the domain stores key material as bytes; infra/rsakey owns the RSA types

        usecase:
          files:
            - "**/internal/usecase/**/*.go"
          deny:
            - pkg: github.com/labstack/echo/v5
              desc: transport is the adapter ring's concern
            - pkg: database/sql
              desc: persistence is the adapter ring's concern
            - pkg: github.com/golang-jwt/jwt/v5
              desc: token encoding is infra/jwt's concern
            - pkg: github.com/nasrulfuad/auto-key-rotation-strategy/my_app/internal/store
              desc: sqlc types may only be seen by adapter/repository/postgres
            - pkg: github.com/nasrulfuad/auto-key-rotation-strategy/my_app/internal/adapter/repository/postgres
              desc: use cases depend on the interfaces in adapter/repository, not on the postgres implementation
            - pkg: github.com/nasrulfuad/auto-key-rotation-strategy/my_app/internal/adapter/gateway/http
              desc: use cases depend on the interfaces in adapter/gateway, not on the HTTP implementation
            - pkg: github.com/nasrulfuad/auto-key-rotation-strategy/my_app/internal/adapter/controller
              desc: use cases must not depend on the transport adapters that call them
            - pkg: github.com/nasrulfuad/auto-key-rotation-strategy/my_app/internal/adapter/presenter
              desc: use cases must not depend on the transport adapters that call them
            - pkg: github.com/nasrulfuad/auto-key-rotation-strategy/my_app/internal/adapter/apidoc
              desc: use cases must not depend on the transport adapters that call them
            - pkg: github.com/nasrulfuad/auto-key-rotation-strategy/my_app/internal/infra/echo
              desc: use cases must not depend on the HTTP server
            - pkg: github.com/nasrulfuad/auto-key-rotation-strategy/my_app/internal/infra/scheduler
              desc: use cases must not depend on the scheduler that runs them
            - pkg: github.com/nasrulfuad/auto-key-rotation-strategy/my_app/internal/infra/config
              desc: use cases receive configuration values, not the config loader
            - pkg: github.com/nasrulfuad/auto-key-rotation-strategy/my_app/internal/di
              desc: use cases must not depend on the composition root

        store-is-private:
          files:
            - "!**/internal/store/*.go"
            - "!**/internal/adapter/repository/postgres/*.go"
            - "!**/internal/di/*.go"
          deny:
            - pkg: github.com/nasrulfuad/auto-key-rotation-strategy/my_app/internal/store
              desc: only adapter/repository/postgres may see sqlc types

  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck, gosec]
      # G115: sqlc maps INTEGER columns to int32 while the domain uses int. Every list limit is a use case constant
      # (100), so no value crossing this boundary can exceed math.MaxInt32.
      - path: internal/adapter/repository/postgres/
        linters: [gosec]
        text: "G115:"
      # G304, G306: fixopenapi only runs from go:generate on the committed spec path chosen by the developer, never
      # on untrusted input, and the spec is a world-readable repository file.
      - path: cmd/fixopenapi/
        linters: [gosec]
        text: "G30[46]:"

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
